<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Drop</title>
  <link rel="stylesheet" href="design.css">
  <!-- Font Awesome pour les icônes -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
  <button class="sidebar-toggle" id="sidebarToggle" aria-label="Ouvrir le menu">
  <span></span>
  <span></span>
  <span></span>
</button>

<div class="sidebar-overlay" id="sidebarOverlay"></div>
  <div class="app-container">
    <!-- PANEL GAUCHE : Arborescence -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <h2>📂 Supports</h2>
        <div class="search-wrapper">
          <i class="fas fa-search search-icon"></i>
          <input type="text" id="search" placeholder="Search...">
        </div>
      </div>
      <nav id="tree-container">
        <!-- Généré dynamiquement par JavaScript -->
      </nav>
    </aside>

    <!-- PANEL DROIT : Contenu -->
    <main class="main-panel">
      <div class="content-header">
        <div class="breadcrumb">
          <span id="breadcrumb-path">Uptime Formation</span>
        </div>
        <div class="module-info">
          <span class="module-badge">Module 8</span>
          <h1 id="page-title">IT Supports</h1>
          <p id="page-subtitle">Ressources</p>
        </div>
      </div>
      <div class="content-body" id="content-display">
        <div class="welcome-message">
          <i class="fas fa-hand-peace" style="font-size: 3rem; color: #e67e22; margin-bottom: 20px;"></i>
          <h2>Bienvenue sur votre plateforme de ressources</h2>
          <p>Sélectionnez une ressource dans le menu de gauche pour commencer</p>
          <div class="quick-stats">
            <div class="stat">
              <i class="fas fa-folder-open"></i>
              <span id="total-categories">0</span>
              <small>Catégories</small>
            </div>
            <div class="stat">
              <i class="fas fa-link"></i>
              <span id="total-links">0</span>
              <small>Ressources</small>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
  <script src="script.js"></script>

  <script src="script.js"></script>
</body>
</html>
